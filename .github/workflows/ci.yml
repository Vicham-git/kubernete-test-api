
  name: CI/CD
  
  on:
    push:
      branches:
        - develop
    pull_request:
      branches:
        - develop
  
  permissions:
    contents: read
    packages: write
  
  jobs:
    test:
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Test application
          run: |
            python -c "from app.main import app; print('Application OK')"
    
    build:
      needs: test
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build Docker image
          run: |
            docker build -t ghcr.io/${{ github.repository_owner }}/python-api:${{ github.sha }} .
            docker tag ghcr.io/${{ github.repository_owner }}/python-api:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/python-api:latest

        - name: Push Docker image
          run: |
            docker push ghcr.io/${{ github.repository_owner }}/python-api:${{ github.sha }}
            docker push ghcr.io/${{ github.repository_owner }}/python-api:latest